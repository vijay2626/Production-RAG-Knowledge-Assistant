[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"
[project]
name="production-rag-knowledge-assistant"
version="1.0.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.116,<1","uvicorn[standard]>=0.35,<1","pydantic>=2.11,<3","pydantic-settings>=2.10,<3","sqlalchemy>=2,<3","psycopg[binary]>=3.2,<4","pgvector>=0.4,<1","python-jose[cryptography]>=3.5,<4","passlib[bcrypt]>=1.7,<2","redis>=6,<7","prometheus-client>=0.22,<1"]
[project.optional-dependencies]
dev=["pytest>=8.4,<9","pytest-cov>=6,<7","ruff>=0.13,<1","mypy>=1.17,<2","pip-audit>=2.9,<3"]
[tool.pytest.ini_options]
testpaths=["tests"]
[tool.ruff]
line-length=100
target-version="py312"
[tool.ruff.lint]
select=["E","F","I","B","UP"]
[tool.mypy]
python_version="3.12"
ignore_missing_imports=true
